server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Docusaurus fingerprints files under assets/ (e.g. styles.<hash>.css) — safe to cache
    # forever since a content change always ships under a new hash.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Every doc route is pre-rendered to its own index.html at build time, so a 404 here
    # means the path is genuinely missing.
    location / {
        try_files $uri $uri/ =404;
    }

    # error_page (unlike try_files' fallback arg) keeps the response status at 404 while
    # still serving Docusaurus's generated error page content.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
